# Visite automatique de la base Supabase tous les 3 jours : un projet gratuit est mis en pause
# après une semaine sans activité. La fonction ping() renvoie seulement l'heure, aucune donnée.
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY (les mêmes valeurs que VITE_… dans .env).
name: Garder Supabase actif

on:
  schedule:
    - cron: '0 6 */3 * *' # tous les 3 jours à 6 h (heure UTC)
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la fonction ping de la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
